version: '3'
services:
  db:
    image: postgis/postgis:latest
    container_name: postgis-db
    environment:
      POSTGRES_DB: spatial_api_dev
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: gis
    volumes:
      - postgres_data_18:/home/mn/postgres/gis
    ports:
      - "5433:5432"
volumes:
  postgres_data_18:
